openapi: 3.1.0
info:
  title: calculatePension API
  version: 3.1.0
servers:
  - url: https://calculatepension-api.onrender.com

paths:
  /validateContributionHistory:
    post:
      operationId: validateContributionHistory
      summary: Validate contribution history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Validation result

  /calculatePension:
    post:
      operationId: calculatePension
      summary: Calculate estimated pension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Pension result

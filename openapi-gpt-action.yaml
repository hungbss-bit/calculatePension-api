openapi: 3.1.0
info:
  title: calculatePension API
  version: 2.2.0
  description: >
    Kiểm tra dữ liệu quá trình BHXH và dự tính lương hưu Việt Nam.
    Dùng checkPensionApiHealth để kiểm tra kết nối, getPensionCapabilities
    để kiểm tra phiên bản, validateContributionHistory để kiểm tra hồ sơ,
    và calculatePension để tính kết quả.
servers:
  - url: https://calculatepension-api.onrender.com

paths:
  /health:
    get:
      operationId: checkPensionApiHealth
      summary: Kiểm tra API có đang hoạt động
      description: Gọi khi bắt đầu chẩn đoán Action hoặc khi một Action khác bị lỗi.
      responses:
        "200":
          description: API đang hoạt động
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/capabilities:
    get:
      operationId: getPensionCapabilities
      summary: Xem phiên bản và khả năng tính toán
      description: >
        Gọi sau checkPensionApiHealth để xác nhận API key, phiên bản API
        và các trường hợp được hỗ trợ.
      security:
        - APIKeyHeader: []
      responses:
        "200":
          description: Thông tin khả năng API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/validateContributionHistory:
    post:
      operationId: validateContributionHistory
      summary: Kiểm tra quá trình tham gia BHXH
      description: >
        Dùng trước calculatePension khi dữ liệu được đọc từ PDF, ảnh hoặc Mẫu 07/SBH.
        Kiểm tra tháng trống, tháng trùng, trạng thái tham gia, mức đóng và xác nhận dữ liệu.
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PensionRequest"
      responses:
        "200":
          description: Kết quả kiểm tra quá trình
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryValidationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/calculatePension:
    post:
      operationId: calculatePension
      summary: Dự tính lương hưu
      description: >
        Gọi khi đã có ngày sinh, giới tính, tháng bắt đầu hưởng, trường hợp nghỉ hưu
        và quá trình BHXH hợp lệ. Trả mức bình quân, tỷ lệ hưởng và lương hưu dự tính.
      security:
        - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PensionRequest"
            examples:
              doanhNghiep:
                summary: Dữ liệu trực tiếp đã là tổng mức đóng VND
                value:
                  person:
                    date_of_birth: "1969-09-01"
                    sex: female
                  pension_start_month: "2026-10"
                  retirement_case: normal
                  source_document_type: direct_input
                  history_confirmed: true
                  gaps_confirmed_as_non_contribution: true
                  contributions:
                    - from_month: "1996-10"
                      to_month: "2026-09"
                      participation_status: contributed
                      contribution_type: compulsory_employer
                      basis_input_type: total_vnd
                      monthly_basis_vnd: 10800000
                      confirmation_status: confirmed
                  adjustment:
                    coefficient_year: 2026
              mau07Sbh:
                summary: Một dòng Mẫu 07/SBH dạng hệ số
                value:
                  person:
                    date_of_birth: "1965-06-25"
                    sex: male
                  pension_start_month: "2026-12"
                  retirement_case: normal
                  source_document_type: mau_07_sbh
                  history_confirmed: true
                  gaps_confirmed_as_non_contribution: true
                  contributions:
                    - from_month: "2026-07"
                      to_month: "2026-11"
                      participation_status: contributed
                      contribution_type: compulsory_state
                      basis_input_type: mau_07_sbh_components
                      sbh_components:
                        unit: coefficient
                        base_value: 6.1
                        position_allowance: 0.3
                        seniority_beyond_frame_allowance: 0
                        professional_seniority_allowance: 0
                        regional_allowance: 0
                        other_allowance: 0
                        reelection_allowance: 0
                        base_salary_vnd_override: 2530000
                      source_row_id: "07-SBH-01"
                      confirmation_status: confirmed
                  adjustment:
                    coefficient_year: 2026
      responses:
        "200":
          description: Kết quả dự tính
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PensionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    Unauthorized:
      description: Thiếu hoặc sai API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
      required: [status, service, version]

    CapabilitiesResponse:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        legal_rule_version:
          type: string
        built_in_coefficient_years:
          type: array
          items:
            type: integer
        supported_retirement_cases:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
      required: [service, version]

    PensionRequest:
      type: object
      required:
        - person
        - pension_start_month
        - retirement_case
        - contributions
      properties:
        person:
          $ref: "#/components/schemas/Person"
        pension_start_month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
          description: Tháng bắt đầu hưởng, định dạng YYYY-MM.
        retirement_case:
          type: string
          enum:
            - normal
            - hazardous_or_special_region
            - underground_coal
            - reduced_capacity
            - occupational_hiv
            - armed_forces
        source_document_type:
          type: string
          enum: [direct_input, mau_07_sbh, vssid, other]
          default: direct_input
        history_confirmed:
          type: boolean
          default: true
        gaps_confirmed_as_non_contribution:
          type: boolean
          default: false
        contributions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ContributionPeriod"
        impairment_percent:
          type: number
          minimum: 0
          maximum: 100
        impairment_assessment_month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        eligibility_achieved_month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        hazardous_or_special_region_months:
          type: integer
          minimum: 0
          default: 0
        especially_hazardous_months:
          type: integer
          minimum: 0
          default: 0
        underground_coal_months:
          type: integer
          minimum: 0
          default: 0
        state_salary_values_are_converted:
          type: boolean
          default: false
        transitional_minimum_floor_eligible:
          type: boolean
          default: false
        reference_level_vnd:
          type: number
          exclusiveMinimum: 0
        adjustment:
          $ref: "#/components/schemas/AdjustmentInput"

    Person:
      type: object
      required: [date_of_birth, sex]
      properties:
        date_of_birth:
          type: string
          format: date
        sex:
          type: string
          enum: [male, female]

    ContributionPeriod:
      type: object
      required:
        - from_month
        - to_month
        - participation_status
        - confirmation_status
      properties:
        from_month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        to_month:
          type: string
          pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        participation_status:
          type: string
          enum: [contributed, credited_duration_only, not_participating]
        duration_only_reason:
          type: string
          enum: [pre1995_no_salary_or_living_allowance]
        contribution_type:
          type: string
          enum: [compulsory_state, compulsory_employer, voluntary]
        basis_input_type:
          type: string
          enum:
            - total_vnd
            - converted_state_vnd
            - component_sum_vnd
            - mau_07_sbh_components
            - salary_coefficient
            - unknown
          default: total_vnd
        monthly_basis_vnd:
          type: number
          exclusiveMinimum: 0
        sbh_components:
          $ref: "#/components/schemas/Mau07SbhBasisComponents"
        source_row_id:
          type: string
        source_text:
          type: string
        confirmation_status:
          type: string
          enum: [confirmed, unconfirmed, unclear]
        coefficient_override:
          type: number
          exclusiveMinimum: 0
        note:
          type: string
        qualifying_hazardous:
          type: boolean
          default: false
        qualifying_especially_hazardous:
          type: boolean
          default: false
        qualifying_underground_coal:
          type: boolean
          default: false
      description: >
        Nếu participation_status=contributed thì phải có contribution_type.
        Với total_vnd phải gửi monthly_basis_vnd.
        Với mau_07_sbh_components phải gửi sbh_components và không gửi monthly_basis_vnd.
        Với not_participating không cần mức đóng hoặc contribution_type.

    Mau07SbhBasisComponents:
      type: object
      required: [unit, base_value]
      properties:
        unit:
          type: string
          enum: [coefficient, vnd]
        base_value:
          type: number
          minimum: 0
        position_allowance:
          type: number
          minimum: 0
          default: 0
        seniority_beyond_frame_allowance:
          type: number
          minimum: 0
          default: 0
        professional_seniority_allowance:
          type: number
          minimum: 0
          default: 0
        regional_allowance:
          type: number
          minimum: 0
          default: 0
        other_allowance:
          type: number
          minimum: 0
          default: 0
        reelection_allowance:
          type: number
          minimum: 0
          default: 0
        base_salary_vnd_override:
          type: number
          exclusiveMinimum: 0
      description: >
        Tổng = base_value + position_allowance + seniority_beyond_frame_allowance
        + professional_seniority_allowance + regional_allowance + other_allowance
        + reelection_allowance. Mọi thành phần phải cùng đơn vị.

    AdjustmentInput:
      type: object
      properties:
        coefficient_year:
          type: integer
          minimum: 2025
          maximum: 2100
          default: 2026
        salary_coefficients:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
        voluntary_income_coefficients:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0

    HistoryValidationResult:
      type: object
      properties:
        valid_for_calculation:
          type: boolean
        total_unique_months:
          type: integer
        average_basis_months:
          type: integer
        credited_duration_only_months:
          type: integer
        excluded_non_participation_months:
          type: integer
        gaps:
          type: array
          items:
            type: object
        overlaps:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            type: object
      required: [valid_for_calculation, total_unique_months]

    PensionResponse:
      type: object
      properties:
        status:
          type: string
          enum: [eligible, not_eligible, needs_more_data, manual_review]
        error_code:
          type: string
        eligibility:
          type: object
        contribution_summary:
          type: object
        average_basis:
          type: object
          properties:
            average_monthly_basis_vnd:
              type: number
            basis_months_used:
              type: integer
            method:
              type: string
            coefficient_year:
              type: integer
        pension_rate:
          type: object
          properties:
            base_rate_percent:
              type: number
            early_retirement_reduction_percent:
              type: number
            final_rate_percent:
              type: number
        pension_calculation_formula:
          type: string
        estimated_monthly_pension_vnd:
          type: number
        one_time_retirement_allowance_vnd:
          type: number
        basis_component_audit:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        audit_steps:
          type: array
          items:
            type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        detail:
          description: Nội dung lỗi do API trả về.

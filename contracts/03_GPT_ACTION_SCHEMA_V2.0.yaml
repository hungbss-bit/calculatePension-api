            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Phụ cấp thâm niên vượt khung
          default: '0'
        professional_seniority_allowance:
          anyOf:

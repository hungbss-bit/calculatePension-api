openapi: 3.1.0
info:
  title: calculatePension API
  version: 2.3.7
  description: API hỗ trợ dự tính lương hưu BHXH dân sự.

servers:
  - url: https://calculatepension-api.onrender.com

paths:
  /health:
    get:
      operationId: checkPensionApiHealth
      summary: Kiểm tra trạng thái API
      description: Kiểm tra API hoạt động.
      responses:
        "200":
          description: API đang hoạt động.

  /v1/validateContributionHistory:
    post:
      operationId: validateContributionHistory
      summary: Kiểm tra quá trình đóng BHXH
      description: Kiểm tra dữ liệu BHXH đã chuẩn hóa, loại BHTN và xác nhận nghề nặng nhọc.
      responses:
        "200":
          description: Kết quả kiểm tra dữ liệu.

  /v1/calculatePension:
    post:
      operationId: calculatePension
      summary: Tính lương hưu dự kiến
      description: Tính điều kiện hưởng, mức bình quân, tỷ lệ và mức lương hưu dự kiến từ dữ liệu BHXH hợp lệ.
      responses:
        "200":
          description: Kết quả tính lương hưu.

components:
  schemas:

    PensionRequest:
      type: object
      description: Dữ liệu dùng để tính lương hưu dự kiến.
      required:
        - person
        - pension_start_month
        - contributions

      properties:

        person:
          type: object
          description: Thông tin cá nhân xác định tuổi nghỉ hưu.
          properties:
            gender:
              type: string
            date_of_birth:
              type: string

        pension_start_month:
          type: string
          description: Tháng bắt đầu hưởng lương hưu dự kiến.

        retirement_case:
          type: string
          description: GPT tự xác định trường hợp nghỉ hưu khi cần.
          enum:
            - normal
            - hazardous_or_special_region
            - underground_coal
            - reduced_capacity
            - policy_no_reduction
            - occupational_hiv
            - armed_forces

        contributions:
          type: array
          description: Chỉ gửi thời gian BHXH hợp lệ sau khi loại BHTN.
          items:
            type: object
            properties:

              from_month:
                type: string

              to_month:
                type: string

              contribution_type:
                type: string
                enum:
                  - compulsory_state
                  - compulsory_employer
                  - voluntary

              basis_input_type:
                type: string
                description: Cách xác định mức đóng.
                enum:
                  - total_vnd
                  - converted_state_vnd
                  - component_sum_vnd
                  - mau_07_sbh_components
                  - salary_coefficient

              monthly_basis_vnd:
                type: number

              sbh_components:
                type: object
                description: Thành phần tiền lương theo Mẫu 07/SBH.
                properties:
                  base_value:
                    type: number
                  position_allowance:
                    type: number
                  professional_seniority_allowance:
                    type: number
                  seniority_beyond_frame_allowance:
                    type: number
                  regional_allowance:
                    type: number
                  other_allowance:
                    type: number

              include_pension:
                type: boolean

        early_retirement_policy:
          type: object
          description: Chỉ dùng khi nghỉ trước tuổi không giảm tỷ lệ theo chính sách đặc biệt.
          properties:
            policy_code:
              type: string
            legal_document_number:
              type: string
            confirmation_status:
              type: string

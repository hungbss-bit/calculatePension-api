openapi: 3.1.0
info:
  title: calculatePension API
  version: 3.1.0
servers:
  - url: https://calculatepension-api.onrender.com
paths:

  /validateContributionHistory:
    post:
      operationId: validateContributionHistory
      summary: Kiểm tra lịch sử đóng BHXH trước khi tính lương hưu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PensionCalculationRequest"
      responses:
        "200":
          description: Kết quả kiểm tra dữ liệu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"

  /calculatePension:
    post:
      operationId: calculatePension
      summary: Dự tính lương hưu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PensionCalculationRequest"
      responses:
        "200":
          description: Kết quả dự tính lương hưu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PensionCalculationResponse"


components:
  schemas:

    PensionCalculationRequest:
      type: object
      required:
        - person
        - pension_start_month
        - retirement_case
        - contributions
      properties:

        person:
          $ref: "#/components/schemas/Person"

        pension_start_month:
          type: string
          description: Tháng bắt đầu hưởng lương hưu, định dạng YYYY-MM
          example: "2026-10"

        retirement_case:
          type: string
          enum:
            - normal
            - hazardous_or_special_region
            - underground_coal
            - reduced_capacity
          description: Trường hợp nghỉ hưu

        impairment_percent:
          type: number
          description: Tỷ lệ suy giảm khả năng lao động, chỉ dùng khi có căn cứ
          minimum: 0
          maximum: 100

        contributions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ContributionPeriod"


    Person:
      type: object
      required:
        - date_of_birth
        - sex
      properties:

        date_of_birth:
          type: string
          format: date
          description: Ngày sinh
          example: "1969-09-01"

        sex:
          type: string
          enum:
            - male
            - female
          description: Giới tính


    ContributionPeriod:
      type: object
      required:
        - from_month
        - to_month
        - participation_status
      properties:

        from_month:
          type: string
          description: Tháng bắt đầu, định dạng YYYY-MM
          example: "2010-01"

        to_month:
          type: string
          description: Tháng kết thúc, định dạng YYYY-MM
          example: "2012-12"

        participation_status:
          type: string
          enum:
            - contributed
            - credited_duration_only
            - not_participating

        duration_only_reason:
          type: string
          enum:
            - pre1995_no_salary_or_living_allowance

        contribution_type:
          type: string
          enum:
            - compulsory_state
            - compulsory_employer
            - voluntary

        basis_input_type:
          type: string
          description: Cách cung cấp mức làm căn cứ đóng
          enum:
            - mau_07_sbh_components
            - monthly_basis_vnd

        monthly_basis_vnd:
          type: number
          description: Tổng mức làm căn cứ đóng bằng VND/tháng khi nhập trực tiếp
          minimum: 0

        sbh_components:
          $ref: "#/components/schemas/SbhComponents"


    SbhComponents:
      type: object
      required:
        - unit
        - base_value
      properties:

        unit:
          type: string
          enum:
            - coefficient
            - vnd

        base_value:
          type: number
          minimum: 0
          description: Giá trị cột Mức đóng

        position_allowance:
          type: number
          minimum: 0
          default: 0

        seniority_beyond_frame_allowance:
          type: number
          minimum: 0
          default: 0

        professional_seniority_allowance:
          type: number
          minimum: 0
          default: 0

        regional_allowance:
          type: number
          minimum: 0
          default: 0

        other_allowance:
          type: number
          minimum: 0
          default: 0

        reelection_allowance:
          type: number
          minimum: 0
          default: 0


    ValidationResponse:
      type: object
      required:
        - validation
      properties:

        validation:
          type: boolean
          description: true nếu lịch sử đóng hợp lệ

        detail:
          type: string

        error_code:
          type: string

        field:
          type: string


    PensionCalculationResponse:
      type: object
      properties:

        total_months:
          type: integer
          minimum: 0

        average_salary:
          type: number
          minimum: 0

        replacement_rate:
          type: number

        early_retirement_reduction:
          type: number

        estimated_pension:
          type: number
          minimum: 0

        warnings:
          type: array
          items:
            type: string